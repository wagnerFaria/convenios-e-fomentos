# Proxy reverso do ambiente de desenvolvimento: um único ponto de entrada para o frontend e a API.
#
#   /api/*  -> api (backend em Go, :8080)
#   /storage/* -> minio (API S3, :9000), sem o prefixo
#   /minio-console/* -> minio (console, :9001), só em desenvolvimento
#   demais  -> web (Next.js, :3000), inclusive /bff/* e o WebSocket do HMR
#
# Os nomes "api" e "web" são resolvidos pelo DNS do Docker; sem o resolvers/init-addr o HAProxy
# nem iniciaria se um dos serviços ainda não existisse.

global
    log stdout format raw local0
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Conexões longas (WebSocket do HMR do Next).
    timeout tunnel  1h
    timeout http-request 10s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend http_in
    bind *:80

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host %[req.hdr(host)]

    acl is_api path_beg /api/
    acl is_api path /api
    acl is_storage path_beg /storage/
    acl is_console path_beg /minio-console/
    acl is_console path /minio-console

    # Os ACLs são avaliados na hora do uso, depois da reescrita do caminho: a decisão de
    # roteamento é guardada numa variável antes de remover o prefixo.
    http-request set-var(txn.route) str(api) if is_api
    http-request set-var(txn.route) str(storage) if is_storage
    http-request set-var(txn.route) str(console) if is_console
    acl route_api var(txn.route) -m str api
    acl route_storage var(txn.route) -m str storage
    acl route_console var(txn.route) -m str console

    # O prefixo é removido antes de chegar ao MinIO: a URL pré-assinada é calculada sobre
    # /<bucket>/<objeto> e o Host original (SigV4 inclui ambos), então o prefixo /storage só
    # existe do lado do navegador. O Host não pode ser alterado.
    http-request replace-path ^/storage/(.*) /\1 if route_storage
    http-request replace-path ^/minio-console/?(.*) /\1 if route_console

    use_backend api if route_api
    use_backend minio_s3 if route_storage
    use_backend minio_console if route_console
    default_backend web

backend api
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200
    server api api:8080 check resolvers docker init-addr libc,none

backend web
    # O Next dev não tem rota de health dedicada; basta a raiz responder (200 ou redirecionamento).
    option httpchk
    http-check send meth GET uri /
    http-check expect rstatus ^[23]
    server web web:3000 check resolvers docker init-addr libc,none

backend minio_s3
    # Uploads/downloads de até 200 MB: tempo maior de resposta do servidor.
    timeout server 10m
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio
    http-check expect status 200
    server minio minio:9000 check resolvers docker init-addr libc,none

backend minio_console
    # Console de administração (WebSocket para notificações): apenas em desenvolvimento.
    option httpchk
    http-check send meth GET uri /
    http-check expect rstatus ^[23]
    server minio minio:9001 check resolvers docker init-addr libc,none
