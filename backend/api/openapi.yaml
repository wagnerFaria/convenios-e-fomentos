        "409": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/submit:
    post:
      tags: [Projetos]
      summary: Envia o projeto (o rascunho passa a "submitted")
      description: |
        Corpo: `{version, declaration}`. `version` é a versão que o proponente viu (409 `project_version_conflict` se o projeto mudou) e
        `declaration` precisa ser `true`: o aceite da declaração de veracidade, registrado com data, hora, IP e CPF mascarado (422 em `declaration`).
        O envio só acontece sem pendências que bloqueiam (422 `project_has_issues`, com `details.issues`) e com o número do SIGCon livre entre os projetos já enviados
        (422 em `sigconNumber`). Avisos (`warn`) não impedem.
        Efeitos, numa única transação: dá o `code` (`AAAA-NNNNNN`, sequencial por ano, ano de Cuiabá), põe o projeto na etapa `awaiting_checklist`,
        descarta envios de arquivo nunca confirmados, guarda a versão 1 (retrato imutável com o projeto, o checklist, os parâmetros de regras vigentes e o aceite)
        e registra a auditoria. Depois da transação, envia o e-mail de confirmação ao e-mail principal do proponente (falha no e-mail não desfaz o envio).
        Enviado depois da data-limite eleitoral vigente: `lateSubmission: true` (não bloqueia).
        Depois do envio, as seções, os documentos e a exclusão respondem 409 `project_not_editable`; novo envio, 409 `project_already_submitted`.
        Permissão: `admin::projects.submit` (condição de criador para o proponente). Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, declaration]
              properties:
                version: {type: integer, minimum: 1}
                declaration: {type: boolean}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/receipt:
    get:
      tags: [Projetos]
      summary: Comprovante de recebimento (PDF)
      description: "Gerado a partir do retrato imutável do envio, então sai sempre igual. Traz o código, a data e hora do recebimento, o resumo do projeto, os documentos entregues ou justificados, a declaração aceita e o aviso de que não é o protocolo oficial (SIGADOC). Resposta `application/pdf` (fora do envelope JSON). Projeto em rascunho ou fora do alcance da permissão: 404. Permissão: `admin::projects.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/complement-requests:
    post:
      tags: [Projetos]
      summary: Pede complementação ao proponente (equipe)
      description: |
        Devolve itens ao proponente: o projeto vai de `awaiting_checklist` ou `in_analysis` para `awaiting_proponent` e o prazo começa a correr:
        `complement_days` dias corridos (padrão 3), até 23:59:59 de Cuiabá do último dia. Cada item é uma seção (`kind: section`; `target`:
        `proponent|institution|proposal|funding|document-options`) ou um documento do checklist (`kind: document`; `target`: `codigo` ou `codigo@id-da-emenda`),
        com uma nota opcional. Enquanto o pedido está aberto o proponente só altera o que foi devolvido (e documentos que ficarem pendentes);
        o resto responde 409 `not_returned`. O proponente recebe um e-mail com o prazo e os itens.
        Erros: 409 `project_not_submitted` (rascunho ou arquivado), 409 `project_stage_invalid` (já aguardando o proponente), 422 (itens inválidos).
        Permissão: `admin::projects.request-complement`. Responde o projeto completo (`complement` traz o pedido).
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                message: {type: string, maxLength: 2000}
                items:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [kind, target]
                    properties:
                      kind: {type: string, enum: [section, document]}
                      target: {type: string}
                      note: {type: string, maxLength: 500}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/resubmit:
    post:
      tags: [Projetos]
      summary: Reenvia o projeto com as correções
      description: |
        Corpo `{version, declaration}`, como no envio. Só vale com um pedido de complementação aberto e dentro do prazo (409 `project_not_awaiting`);
        confere as pendências (422 `project_has_issues`), a versão lida (409 `project_version_conflict`) e o número do SIGCon entre os projetos enviados.
        Guarda uma nova versão imutável (reason `complement`), trava os arquivos atuais, descarta envios não confirmados, marca o pedido como `answered`
        e devolve o projeto para a análise (`in_analysis`). Não exige que todos os itens devolvidos tenham sido alterados (cada item informa `answered`).
        O código não muda. Permissão: `admin::projects.submit` (condição de criador). Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, declaration]
              properties:
                version: {type: integer, minimum: 1}
                declaration: {type: boolean}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/withdraw:
    post:
      tags: [Projetos]
      summary: Desistência do projeto (proponente)
      description: |
        O projeto enviado é arquivado, com o motivo (`note`, de 3 a 1.000 caracteres) e a razão `withdrawn`. Cancela o pedido de complementação aberto.
        Arquivar é definitivo: para tentar de novo, use `duplicate`. Rascunho não se arquiva (exclua-o): 409 `project_not_submitted`; já arquivado: 409 `project_archived`.
        O número do SIGCon fica livre. Permissão: `admin::projects.withdraw` (condição de criador). Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/deny:
    post:
      tags: [Projetos]
      summary: Nega o projeto (Secretário)
      description: |
        Arquiva o projeto enviado sem passar por parecer técnico, razão `denied`, com o motivo em `note` (3 a 1.000 caracteres). O proponente recebe um e-mail
        com o motivo. Permissão: `admin::projects.deny`. Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/archive:
    post:
      tags: [Projetos]
      summary: Arquiva o projeto (equipe)
      description: |
        Arquiva o projeto enviado por `missing_documents` (falta de documentos obrigatórios) ou `other`, com o motivo em `note`. O proponente, os Revisores do departamento (se já havia um), o Analista responsável (ou, sem responsável, os Analistas) e os Supervisores recebem um e-mail.
        Permissão: `admin::projects.archive`. Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, note]
              properties:
                reason: {type: string, enum: [missing_documents, other]}
                note: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/start-analysis:
    post:
      tags: [Projetos]
      summary: Assume a análise do projeto (Analista)
      description: |
        "Aguardando análise de checklist" passa a "Em análise" e quem assumiu vira o **analista responsável** (informativo: qualquer Analista pode agir no projeto).
        Idempotente: repetir não muda nada, e outro Analista que chame depois não troca o responsável. Se o projeto já está em análise mas sem responsável (voltou de uma
        complementação pedida antes de alguém assumir), o primeiro a assumir vira o responsável. Erros: 409 `project_not_submitted` (rascunho ou arquivado) e 409
        `project_stage_invalid` (aguardando o proponente). Permissão: `admin::projects.start-analysis`. Responde o projeto completo, na visão da equipe.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/review/items:
    put:
      tags: [Projetos]
      summary: Aprova, reprova (com justificativa) ou desfaz a decisão sobre um item da conferência (Analista)
      description: |
        Exige o projeto em análise (409 `analysis_not_started` antes de assumir; 409 `project_stage_invalid` aguardando o proponente). `kind` e `target`:
        `section` (`proponent`, `institution`, `proposal`, `funding`, `document-options`), `document` (`codigo` ou `codigo@id-da-emenda` do checklist) e `extra`
        (id do documento adicional). Item inexistente, ou documento obrigatório sem arquivo nem justificativa: 422 `item_not_reviewable`.
        `decision`: `approved`, `rejected` (exige `note`, a justificativa, de 1 a 500 caracteres; documento adicional só pode ser aprovado) ou `pending` (desfaz). O campo antigo
        `approved` (true aprova, false desfaz) continua aceito quando `decision` vem vazio. Reprovar não devolve o item: ele só vai ao proponente num pedido de complementação,
        que o volta a pendente. Item reprovado impede indicar o departamento (409 `review_incomplete`, com `details.rejected`).
        **Aprovar ou reprovar documento com arquivo exige que o próprio Analista tenha visto cada arquivo atual**: senão 422 `file_not_opened` com `details.files`
        (até 20) e `details.total`. "Ver" é a exibição no visualizador, registrada por pessoa em `POST .../documents/files/{fileId}/viewed`; baixar o arquivo não conta.
        Aprovar, reprovar e desfazer são idempotentes. A justificativa **não** vai para a auditoria (texto livre). Responde o projeto completo com `review` (itens, `summary` com `rejected`, `allApproved`)
        e `analyst`, que **só a equipe** recebe. Cada item traz `status` (`pending`, `approved` ou `rejected`) e, se reprovado, `note`. Cada arquivo em `review.items[].files`
        traz `opened`: se o administrador que consulta já o viu. Permissão: `admin::projects.review-item`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
              properties:
                kind: {type: string, enum: [section, document, extra]}
                target: {type: string}
                decision: {type: string, enum: [approved, rejected, pending]}
                note: {type: string, maxLength: 500, description: Justificativa; obrigatória com `rejected`.}
                approved: {type: boolean, deprecated: true, description: Formato anterior; use `decision`.}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/department:
    put:
      tags: [Projetos]
      summary: Indica o departamento de enquadramento (Analista)
      description: |
        Abre uma **rodada** de enquadramento: o projeto passa a aparecer só para os Revisores do departamento indicado, e os Supervisores recebem um e-mail.
        Exige `submitted`, etapa `in_analysis` (409 `analysis_not_started` antes de assumir; 409 `project_stage_invalid` aguardando o proponente ou o parecer),
        **tudo aprovado** na conferência (409 `review_incomplete`, com `details.pending` e `details.blockers`) e nenhum enquadramento pendente (409 `framing_pending`).
        O departamento precisa existir (422), ser área finalística (422 `department_not_finalistic`) e ter ao menos um Revisor ativo (422 `department_without_reviewer`).
        A etapa continua `in_analysis`. Responde o projeto completo com `framing` (a rodada em curso) e `framings` (o histórico). Permissão: `admin::projects.assign-department`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId: {type: string, format: uuid}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/framing/confirm:
    post:
      tags: [Projetos]
      summary: Confirma o enquadramento (Revisor do Departamento)
      description: |
        O projeto se enquadra no departamento: a rodada fica `confirmed`, o departamento é mantido e a etapa passa a `awaiting_opinion` ("Aguardando parecer"). Não envia e-mail.
        `round` é a rodada que o Revisor viu (409 `framing_round_stale` se mudou). **Vale a primeira decisão de qualquer Revisor do departamento**: a segunda recebe 409
        `framing_already_decided`, inclusive quando a primeira foi uma recusa. Permissão: `admin::projects.review-framing`, só sobre os projetos enviados do próprio departamento.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [round]
              properties:
                round: {type: integer, minimum: 1}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/framing/refuse:
    post:
      tags: [Projetos]
      summary: Recusa o enquadramento (Revisor do Departamento)
      description: |
        O projeto não se enquadra: a rodada fica `refused` com a justificativa (3 a 1.000 caracteres, obrigatória), o departamento do projeto é **limpo** (ele sai da fila do
        departamento), a etapa continua `in_analysis` e a conferência não é tocada, então o Analista pode indicar outro departamento direto. **Não há limite de recusas.**
        Os Supervisores recebem um e-mail com o departamento recusado e a justificativa (até 500 caracteres); o Analista não. Mesmos erros de `confirm`.
        Permissão: `admin::projects.review-framing`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [round, justification]
              properties:
                round: {type: integer, minimum: 1}
                justification: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/duplicate:
    post:
      tags: [Projetos]
      summary: Duplica o projeto em um novo rascunho
      description: |
        Cria um rascunho novo com os dados de um projeto do próprio proponente, em qualquer situação (inclusive arquivado); o original não muda. Leva proponente,
        instituição, proposta, municípios, emendas (com ids novos) e recursos, e guarda o vínculo `originProjectId`/`originCode`. Não leva código, envio nem área.
        `copyDocuments: true` copia também os arquivos (objetos novos no armazenamento) e as justificativas, inclusive os documentos por emenda; por padrão não se
        copia, porque certidões e comprovantes vencem. Se algum arquivo não existe mais no armazenamento: 409 `file_missing` e nada é criado.
        Projeto de outra pessoa: 404. Permissão: `admin::projects.create`. Responde 201 com o rascunho.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                copyDocuments: {type: boolean}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/admin/audit-logs:
    get:
      tags: [Auditoria]
      summary: Lista registros de auditoria (filtros por ator, ação, entidade e período)
      description: "Alterações trazem payload.before e payload.after. `actorName` é o nome atual do administrador (nulo para outros atores ou administrador excluído). Permissão: `admin::settings.audit-logs.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: actorType, in: query, schema: {type: string}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: entity, in: query, schema: {type: string}}
        - {name: entityId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string}, description: RFC 3339}
        - {name: to, in: query, schema: {type: string}, description: RFC 3339}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/auth/local/register:
    post:
      tags: [Usuários finais - autenticação]
      summary: Cadastro público
      description: "Respeita as configurações: cadastro habilitado (403 registration_disabled), uma conta por e-mail (409 already_taken) e confirmação obrigatória. Campos extras só são aceitos se constarem em registerAllowedFields (ficam em profile); outros geram 422."
