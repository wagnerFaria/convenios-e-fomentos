        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Tokens de API]
      summary: Edita nome, descrição, tipo e ações (vale na próxima requisição)
      description: "Permissão: `admin::settings.api-tokens.update`. Token revogado não pode ser editado (409 token_revoked)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: {type: string}
                description: {type: string}
                type: {type: string, enum: [read-only, full-access, custom]}
                permissions: {type: array, items: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Tokens de API]
      summary: Revoga o token (efeito imediato e definitivo)
      description: "Permissão: `admin::settings.api-tokens.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Revogado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
