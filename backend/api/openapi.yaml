      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Só os campos que a permissão libera (campos recusados geram 422 com a lista). Campos de sistema nunca são graváveis."
              properties:
                titulo: {type: string, maxLength: 200}
                conteudo: {type: string}
                status: {type: string, enum: [rascunho, publicado], description: "Somente em PUT. Mudar o status exige também a ação publish."}
                observacao_interna: {type: string}
                department_id: {type: [string, "null"], format: uuid, description: "Padrão na criação: departamento do administrador"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
