openapi: 3.1.0
info:
  title: API de Convênios e Fomentos
  version: 0.1.0
  description: |
    Backend com controle de permissões granular (RBAC).
    Respostas de sucesso: `{ "data": ..., "meta": ... }`.
    Respostas de erro: `{ "error": { "status", "code", "message", "details" } }`.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [Infraestrutura]
      summary: Verificação de vida (liveness)
      responses:
        "200":
          description: Aplicação no ar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /ready:
    get:
      tags: [Infraestrutura]
      summary: Verificação de prontidão (consulta o banco)
      responses:
        "200":
          description: Pronta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/register-first:
    post:
      tags: [Autenticação de administradores]
      summary: Registro inicial do primeiro Super Admin
      description: Só funciona enquanto não existir nenhum administrador (403 `setup_completed` depois).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: {type: string}
                lastName: {type: string}
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
      responses:
        "201": {description: Criado}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/auth/login:
    post:
      tags: [Autenticação de administradores]
      summary: Login com e-mail e senha
      description: Limitado por IP + e-mail (429 `rate_limited`). Erro genérico `invalid_credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "200": {$ref: "#/components/responses/TokenPair"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/auth/refresh:
    post:
      tags: [Autenticação de administradores]
      summary: Troca o refresh token por um novo par (rotação)
      description: Reapresentar um refresh token já usado revoga toda a sessão (família).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        "200": {$ref: "#/components/responses/TokenPair"}
        "401": {$ref: "#/components/responses/Error"}
  /admin/auth/logout:
    post:
      tags: [Autenticação de administradores]
      summary: Encerra a sessão atual
      security: [{adminBearer: []}]
      responses:
        "204": {description: Sessão encerrada}
        "401": {$ref: "#/components/responses/Error"}
  /admin/auth/me:
    get:
      tags: [Autenticação de administradores]
      summary: Administrador autenticado, roles e permissões efetivas
      description: |
        `permissions` é a união das permissões de todas as roles (Super Admin recebe todas as ações de admin).
        `fields: null` significa todos os campos; `conditions` vazio significa sem condição (várias condições combinam com OR).
        Serve para o front esconder botões; a autorização real é feita sempre no servidor.
      security: [{adminBearer: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      email: {type: string}
                      firstName: {type: string}
                      lastName: {type: string}
                      departmentId: {type: [string, "null"], format: uuid}
                      isSuperAdmin: {type: boolean}
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string, format: uuid}
                            code: {type: string}
                            name: {type: string}
                      permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            action: {type: string, examples: ["admin::content.document.update"]}
                            subject: {type: string}
                            fields: {type: [array, "null"], items: {type: string}}
                            conditions: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Error"}
  /admin/auth/sessions:
    get:
      tags: [Autenticação de administradores]
      summary: Lista as sessões ativas do administrador
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Autenticação de administradores]
      summary: Revoga todas as sessões
      security: [{adminBearer: []}]
      parameters:
        - {name: keepCurrent, in: query, schema: {type: boolean}, description: Preserva a sessão atual}
      responses:
        "204": {description: Revogadas}
        "401": {$ref: "#/components/responses/Error"}
  /admin/auth/sessions/{id}:
    delete:
      tags: [Autenticação de administradores]
      summary: Revoga uma sessão
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Revogada}
        "404": {$ref: "#/components/responses/Error"}
  /admin/auth/forgot-password:
    post:
      tags: [Autenticação de administradores]
      summary: Solicita a redefinição de senha
      description: Sempre responde 204, exista ou não o e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "204": {description: Solicitação aceita}
        "429": {$ref: "#/components/responses/Error"}
  /admin/auth/reset-password:
    post:
      tags: [Autenticação de administradores]
      summary: Redefine a senha com o token recebido (uso único) e revoga as sessões
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string}
      responses:
        "204": {description: Senha redefinida}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/auth/accept-invite:
    post:
      tags: [Autenticação de administradores]
      summary: Aceita o convite, define a senha e ativa a conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string}
      responses:
        "200": {$ref: "#/components/responses/TokenPair"}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/users/invite:
    post:
      tags: [Administradores]
      summary: Convida um administrador
      description: Retorna a URL de convite (com o token, exibido só aqui). Exige a permissão `admin::settings.users.create` (Super Admin tem acesso total).
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, roleIds]
              properties:
                firstName: {type: string}
                lastName: {type: string}
                email: {type: string, format: email}
                roleIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
                departmentId: {type: string, format: uuid}
      responses:
        "201": {description: Convite criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/users:
    get:
      tags: [Administradores]
      summary: Lista administradores (busca, filtros, ordenação, paginação)
      description: "Permissão: `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Busca em nome, sobrenome e e-mail"}
        - {name: roleId, in: query, schema: {type: string}, description: Filtra por role (UUID)}
        - {name: status, in: query, schema: {type: string}, description: "active, inactive, pending ou blocked"}
        - {name: sort, in: query, schema: {type: string}, description: "Campo:direção. Campos: firstName, lastName, email, createdAt. Ex.: email:asc"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}, description: "Padrão 25, máximo 100"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/users/batch-delete:
    post:
      tags: [Administradores]
      summary: Exclui administradores em lote (tudo ou nada, até 100)
      description: "Permissão: `admin::settings.users.delete`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/users/{id}:
    get:
      tags: [Administradores]
      summary: Detalha um administrador
      description: "Permissão: `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Administradores]
      summary: Edita dados do administrador
      description: "Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: {type: string}
                lastName: {type: string}
                email: {type: string, format: email}
                departmentId: {type: [string, "null"], format: uuid}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Administradores]
      summary: Exclui um administrador
      description: "Não exclui a si mesmo nem o último Super Admin ativo (409). Permissão: `admin::settings.users.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/activate:
    post:
      tags: [Administradores]
      summary: Ativa o administrador
      description: "Convite pendente não pode ser ativado (409 invitation_pending). Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/deactivate:
    post:
      tags: [Administradores]
      summary: Desativa o administrador e revoga as sessões
      description: "409 cannot_modify_self ou last_super_admin. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/roles:
    post:
      tags: [Administradores]
      summary: Atribui roles ao administrador
      description: "Só Super Admin concede a role Super Admin (403). Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/roles/{roleId}:
    delete:
      tags: [Administradores]
      summary: Remove uma role do administrador
      description: "O administrador precisa manter ao menos uma role; o último Super Admin ativo não perde a role (409). Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/roles:
    get:
      tags: [Roles de administrador]
      summary: Lista roles com a contagem de administradores
      description: "Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Roles de administrador]
      summary: Cria uma role
      description: "Permissão: `admin::settings.roles.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/roles/{id}:
    get:
      tags: [Roles de administrador]
      summary: Detalha a role com permissões e contagem de administradores
      description: "Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Roles de administrador]
      summary: Edita nome e descrição
      description: "Permissão: `admin::settings.roles.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Roles de administrador]
      summary: Exclui a role
      description: "409 super_admin_immutable ou role_in_use (com details.userCount). Permissão: `admin::settings.roles.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/roles/{id}/permissions:
    put:
      tags: [Roles de administrador]
      summary: Substitui, em transação, todas as permissões da role
      description: "Valida ações, campos e condições contra os registros. Super Admin é imutável (409). Invalida o cache de permissões. Permissão: `admin::settings.roles.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action: {type: string, examples: ["admin::content.document.update"]}
                      subject: {type: string, description: Padrão = recurso da ação}
                      fields: {type: [array, "null"], items: {type: string}, description: "null = todos os campos; [] = nenhum"}
                      conditions: {type: array, items: {type: string}, description: Combinadas com OR}
                      properties: {type: object}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /admin/roles/{id}/duplicate:
    post:
      tags: [Roles de administrador]
      summary: Duplica a role (nome com sufixo, descrição e permissões)
      description: "Permissão: `admin::settings.roles.create`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/catalog/actions:
    get:
      tags: [Catálogo]
      summary: Ações registradas, agrupadas por categoria
      description: "Base da tela de permissões. Cada ação informa suporte a campos, condições e locales, e os campos configuráveis (availableFields). Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: domain, in: query, schema: {type: string, enum: [admin, api]}, description: "Padrão admin"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/catalog/conditions:
    get:
      tags: [Catálogo]
      summary: Condições disponíveis
      description: "Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/audit-logs:
    get:
      tags: [Auditoria]
      summary: Lista registros de auditoria (filtros por ator, ação, entidade e período)
      description: "Alterações trazem payload.before e payload.after. Permissão: `admin::settings.audit-logs.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: actorType, in: query, schema: {type: string}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: entity, in: query, schema: {type: string}}
        - {name: entityId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string}, description: RFC 3339}
        - {name: to, in: query, schema: {type: string}, description: RFC 3339}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/auth/local/register:
    post:
      tags: [Usuários finais - autenticação]
      summary: Cadastro público
      description: "Respeita as configurações: cadastro habilitado (403 registration_disabled), uma conta por e-mail (409 already_taken) e confirmação obrigatória. Campos extras só são aceitos se constarem em registerAllowedFields (ficam em profile); outros geram 422."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 50, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "201": {description: Criado. Com confirmação de e-mail obrigatória não há tokens}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/local:
    post:
      tags: [Usuários finais - autenticação]
      summary: Login por e-mail ou nome de usuário
      description: "Erro genérico invalid_credentials. Só com a senha correta informa 403 account_blocked ou email_not_confirmed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: {type: string}
                password: {type: string}
      responses:
        "200": {description: Usuário e tokens}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/refresh:
    post:
      tags: [Usuários finais - autenticação]
      summary: Troca o refresh token (rotação com detecção de reuso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
