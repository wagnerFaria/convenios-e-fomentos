        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                exclusiveSupplier: {type: boolean}
                publicSpaceUse: {type: boolean}
                reducedDeadline: {type: boolean}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/members:
    get:
      tags: [Projetos]
      summary: Lista as pessoas com acesso ao projeto (só o titular)
      description: |
        Compartilhamento por CPF. Cada item: `{id, cpf (mascarado), label, level (read|edit), email (o informado pelo titular, mascarado), createdAt, acceptedAt}`. `acceptedAt` vazio = convite
        pendente (a pessoa ainda não abriu o projeto). A API não informa se o CPF tem conta nem o nome da pessoa. Permissão: `admin::projects.share`
        (o proponente só a tem sobre os projetos que criou; 403 para convidados e outros usuários).
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [Projetos]
      summary: Dá acesso ao projeto a um CPF
      description: |
        Corpo: `{cpf, level (read|edit), label?, email?}`. A pessoa é avisada por e-mail: no da conta que tem o CPF (que nunca é revelado ao titular) ou, se não há conta, no `email` informado (422 se inválido); sem nenhum dos dois, o convite vale mas não há aviso. O acesso vale assim que a pessoa entra pelo MT Login com aquele CPF (ou já, se ela tem conta); é conferido
        a cada requisição. **Leitura**: vê o projeto, os arquivos e o comprovante. **Edição**: também altera, anexa documentos, envia e reenvia. Excluir, desistir,
        duplicar e gerir acesso são sempre só do titular. Erros: 422 (CPF inválido ou do próprio titular), 409 `member_exists` (já tem acesso) e
        `members_limit` (10 pessoas por projeto). Limite de 20 convites por minuto por usuário (429). Reconvidar quem teve o acesso revogado reativa o mesmo registro. Auditoria: `project.member-invited` (CPF mascarado).
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, level]
              properties:
                cpf: {type: string}
                level: {type: string, enum: [read, edit]}
                label: {type: string, maxLength: 100}
                email: {type: string, maxLength: 254}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/members/{memberId}:
    put:
      tags: [Projetos]
      summary: Altera o nível ou a identificação de quem tem acesso
      description: "Corpo: `{level (read|edit), label?, email?}` (e-mail vazio mantém o atual). Só o titular. Auditoria: `project.member-updated`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
