      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/extra/{itemId}:
    put:
      tags: [Projetos]
      summary: Altera o título e a descrição de um documento adicional
      description: "Não altera o que já fez parte de uma versão enviada (409 `not_returned`). Responde o checklist. Permissão: `admin::projects.update`."
