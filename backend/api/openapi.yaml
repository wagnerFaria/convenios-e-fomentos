    delete:
      tags: [Projetos]
      summary: Revoga o acesso
      description: "Vale na hora, inclusive para quem está com o projeto aberto. Só o titular. Auditoria: `project.member-revoked`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents:
    get:
      tags: [Projetos]
      summary: Checklist de documentos do projeto
      description: |
        Lista as exigências que se aplicam às respostas do projeto (instrumento, natureza da entidade, tipo de recurso, natureza do objeto,
        calamidade, chamamento, emendas e as situações de `document-options`), com os arquivos e a justificativa já registrados.
        Sem instrumento escolhido, a lista é vazia. Exigências por emenda (`scope: amendment`) têm um item por emenda (`amendmentId`).
        Cada item: `{code, name, description, group, scope, amendmentId, amendmentLabel, source (item do checklist da SEDEC), template {name,url}, acceptsJustification, mandatory,
        files [{id, filename, contentType, sizeBytes, status (pending|confirmed), sha256 (arquivo confirmado), createdAt}], justification, status (missing|done|justified)}`.
        Só arquivo `confirmed` conta como entregue.
        `mandatory` diz se o documento bloqueia a continuidade e o envio: obrigatório sem arquivo nem justificativa gera a pendência bloqueante
        `documents_missing`; opcional (`mandatory: false`) aparece marcado e nunca bloqueia.
        Resposta: `{options, instrument, summary {total, done, justified, missing, requiredTotal, requiredMissing}, items, extraDocuments}`.
        `extraDocuments` são os documentos adicionais do proponente: `[{id, title, description, file (DocFile ou null), locked}]`. Não entram no
        `summary` e nunca bloqueiam o envio.
        `requiredMissing` é o que falta entre os obrigatórios: com 0, o proponente pode seguir para a revisão e o envio.
        Permissão: `admin::projects.read` (404 em projeto fora do alcance).
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/declarations/{code}:
    get:
      tags: [Projetos]
      summary: Prévia de uma declaração gerada pelo sistema e situação da emissão
      description: |
        Monta a declaração a partir do cadastro, com o texto do modelo oficial da SEDEC exatamente como será emitido. Não altera o cadastro.
        Códigos disponíveis: `declaracao_contrapartida` (convênio de município, contrapartida financeira), `declaracao_nao_duplicidade`,
        `declaracao_gratuidade`, `declaracao_publicidade` (essas duas usam os dados pessoais de quem assina, sem RG) e
        `declaracao_compatibilidade_precos`. Para a equipe, o CPF aparece mascarado no texto; o `paramsSha256` é o mesmo para todos.
        Resposta: `{code, name, annex, templateVersion, title, paragraphs, place, signerName, signerRole, institution, paramsSha256, ready, issues, current}`.
        `ready: false` quando faltam dados (`issues` com `section: declaration`); `paramsSha256` resume o conteúdo e muda se o cadastro mudar.
        `current` é a última emissão (nulo se nunca houve): `{id, status (awaiting_signature|signed|rejected|expired|cancelled|superseded), acceptedAt,
        requestedBySigner, signerCpf (mascarado), signedAt, fileId, stale}`. `stale: true` quando o cadastro mudou depois da emissão: a declaração
        deixa de valer e o item do checklist volta a faltar (`declarationStale`). Com a assinatura pendente, a consulta pergunta ao MT-ID e, se o
        signatário já assinou, traz o arquivo assinado para o checklist.
        Código sem modelo ou projeto fora do alcance: 404. Declaração que não se aplica ao projeto: 409 `document_not_applicable`.
        Permissão: `admin::projects.read`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Projetos]
      summary: Cancelar o pedido de assinatura em andamento
      description: |
        Cancela o pedido pendente no MT-ID e marca a emissão como `cancelled`. Sem pedido pendente: 409 `declaration_not_pending`.
        Sem MT-ID configurado: 503 `signature_unavailable`. Permissão: `admin::projects.update` (e o projeto precisa aceitar alterações).
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Cancelado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/declarations/{code}/accept:
    post:
      tags: [Projetos]
      summary: Aceitar o texto da declaração, gerar o PDF e pedir a assinatura
      description: |
        Corpo: `{paramsSha256, confirm}`. `paramsSha256` é o resumo devolvido pela prévia: prova que a pessoa leu o texto que será emitido;
        se o cadastro mudou desde então, 409 `declaration_changed`. `confirm` precisa ser `true` (422 se não).
        Gera o PDF, guarda-o, envia ao MT-ID e pede a assinatura do representante legal (CPF do proponente ou do representante informado).
        Quem pediu pode não ser o signatário (`current.requestedBySigner: false`): o pedido vai para o signatário, que confirma no app MTCidadão.
        Cada declaração tem o seu pedido e o seu arquivo. Pedir de novo com o mesmo conteúdo devolve o pedido em andamento; com conteúdo
        diferente, cancela o pedido anterior ou substitui a declaração assinada desatualizada.
        Faltam dados no cadastro: 422 `declaration_not_ready` (`details.issues`). Já assinada com o mesmo conteúdo: 409 `declaration_already_signed`.
        MT-ID fora do ar: 502 `signature_failed`; não configurado: 503 `signature_unavailable`. Responde a prévia, com `current`.
        Permissão: `admin::projects.update` (e o projeto precisa aceitar alterações). Limite das rotas pesadas.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paramsSha256, confirm]
              properties:
                paramsSha256: {type: string}
                confirm: {type: boolean}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/{code}/justification:
    put:
      tags: [Projetos]
      summary: Grava ou remove a justificativa de não envio de um documento
      description: "`text` vazio remove a justificativa (e o item, se não tiver arquivos). Até 2.000 caracteres. Nas exigências por emenda informe `amendmentId`. Documento que não se aplica ao projeto: 409 `document_not_applicable`. Projeto que não é mais rascunho: 409 `project_not_editable`. Responde o checklist. Permissão: `admin::projects.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amendmentId: {type: string, format: uuid}
                text: {type: string, maxLength: 2000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/{code}/files:
    post:
      tags: [Projetos]
      summary: Registra um arquivo e autoriza o envio direto ao armazenamento
      description: |
        Fluxo em 3 passos, como nos documentos: (1) este pedido devolve `{file, upload}`; (2) o navegador envia o arquivo por POST multipart a
        `upload.url` com os campos `upload.fields` e o arquivo no último campo `file`; (3) `POST .../files/{fileId}/confirm`.
        Tipos: PDF, DOCX, PNG, JPEG e WebP (a extensão deve combinar; PDF/DOCX até 200 MB, imagens até 25 MB). Até 10 arquivos por documento
        (409 `too_many_files`). Nas exigências por emenda, `amendmentId` é obrigatório; nas demais, proibido (422).
        Documento que não se aplica ao projeto: 409 `document_not_applicable`. A chave do objeto nunca é exposta. Permissão: `admin::projects.update`.
        Limites por projeto (409): `too_many_pending` (20 envios em andamento), `project_files_limit` (300 arquivos) e `project_storage_full` (2 GiB, somando
        os tamanhos declarados). Limite de taxa por usuário (`RATE_LIMIT_UPLOAD_PER_MINUTE`): 429 `rate_limited`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
