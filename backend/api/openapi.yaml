                title: {type: string, maxLength: 120}
                description: {type: string, maxLength: 1000}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Projetos]
      summary: Remove um documento adicional e o arquivo dele
      description: "Não remove o que já fez parte de uma versão enviada (409 `not_returned`). Responde o checklist. Permissão: `admin::projects.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/extra/{itemId}/files:
    post:
      tags: [Projetos]
      summary: Registra o arquivo de um documento adicional e autoriza o envio direto ao armazenamento
      description: |
        Mesmo fluxo em 3 passos de `.../documents/{code}/files` (o passo 3 usa `POST .../documents/files/{fileId}/confirm`), com um único arquivo por
        documento adicional (409 `too_many_files`; remova o documento para trocar o arquivo). Permissão: `admin::projects.update`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, sizeBytes]
              properties:
                filename: {type: string, maxLength: 255}
                contentType: {type: string}
                sizeBytes: {type: integer, minimum: 1}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/files/{fileId}/confirm:
    post:
      tags: [Projetos]
      summary: Confirma o envio de um arquivo
      description: "Confere no armazenamento a existência, o tipo, o tamanho e a assinatura do formato. Arquivo que não passa é apagado junto com o registro (422). Antes do envio: 409 `file_not_uploaded`. Idempotente. Permissão: `admin::projects.update`.


        O servidor lê o objeto, calcula o SHA-256 (devolvido em `sha256`) e confere o tamanho real. Com `CLAMAV_ADDR` configurado, o conteúdo também é varrido: arquivo infectado é recusado
        (422), apagado e registrado na auditoria (`project.file-infected`). Scanner indisponível: 503 `scan_unavailable` (falha fechada; nada é liberado e o arquivo continua pendente).
        Limite de taxa por usuário: 429 `rate_limited`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/files/{fileId}/download:
    get:
      tags: [Projetos]
      summary: URL temporária para baixar um arquivo confirmado
      description: "Resposta: `{url, expiresAt}`. A URL baixa o **arquivo original** (como anexo), inclusive do Word. Arquivo pendente: 404. Baixar não conta como ter visto o documento: a prova exigida para aprovar ou reprovar vem de `POST .../viewed`. Todo acesso entra na auditoria. Permissão: `admin::projects.read` (404 em projeto fora do alcance)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/files/{fileId}/preview:
    get:
      tags: [Projetos]
      summary: URL temporária para exibir um arquivo confirmado no navegador
      description: |
        Resposta: `{url, expiresAt, kind, contentType, converted}`. `kind` é `pdf` ou `image`: PDF e imagem são exibidos como estão; o arquivo do Word é **convertido para PDF**
        uma vez (guardado ao lado do original) e vem com `converted: true`. A URL é inline e vale `STORAGE_PREVIEW_TTL`. Arquivo pendente: 404.
        422 `preview_unavailable`: tipo sem exibição, Word grande demais (mais de 50 MB), conversão não configurada (`PREVIEW_CONVERTER_URL`) ou que falhou; nesses casos o cliente oferece o download.
        Todo acesso entra na auditoria. Pedir a URL **não** registra que o arquivo foi visto (ver `POST .../viewed`). Permissão: `admin::projects.read`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/files/{fileId}/viewed:
    post:
      tags: [Projetos]
      summary: Registra que o arquivo foi exibido para quem consulta
      description: "O cliente chama depois de mostrar o conteúdo no visualizador. Quando quem consulta é da equipe (nem titular nem membro), o registro é **por pessoa** e é a prova exigida para aprovar ou reprovar o documento na conferência (`PUT .../review/items`); do titular e dos membros não gera registro. Idempotente. Permissão: `admin::projects.read` (404 em projeto fora do alcance)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/documents/files/{fileId}:
    delete:
