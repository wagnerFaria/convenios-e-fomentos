openapi: 3.1.0
info:
  title: API de Convênios e Fomentos
  version: 0.1.0
  description: |
    Backend com controle de permissões granular (RBAC).
    Respostas de sucesso: `{ "data": ..., "meta": ... }`.
    Respostas de erro: `{ "error": { "status", "code", "message", "details" } }`.
servers:
  - url: http://localhost
paths:
  /api/health:
    get:
      tags: [Infraestrutura]
      summary: Verificação de vida (liveness)
      responses:
        "200":
          description: Aplicação no ar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/ready:
    get:
      tags: [Infraestrutura]
      summary: Verificação de prontidão (consulta o banco)
      responses:
        "200":
          description: Pronta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/auth/me:
    get:
      tags: [Autenticação de administradores]
      summary: Administrador autenticado, roles e permissões efetivas
      description: |
        Autenticação pelo access token do MT Login (Keycloak/OIDC). Na primeira requisição de um CPF ainda
        desconhecido o administrador é criado, ativo e sem roles; nome e e-mail são atualizados a cada acesso.
        Um administrador sem roles recebe `permissions: []`. Conta desativada ou bloqueada responde 403
        `account_disabled`; token sem CPF válido, 403 `invalid_identity`.
        `permissions` é a união das permissões de todas as roles (Super Admin recebe todas as ações de admin).
        `fields: null` significa todos os campos; `conditions` vazio significa sem condição (várias condições combinam com OR).
        Serve para o front esconder botões; a autorização real é feita sempre no servidor.
      security: [{adminBearer: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      cpf: {type: string, description: "CPF completo e formatado do próprio usuário (123.456.789-09)"}
                      email: {type: string}
                      firstName: {type: string}
                      lastName: {type: string}
                      departmentId: {type: [string, "null"], format: uuid}
                      isSuperAdmin: {type: boolean}
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string, format: uuid}
                            code: {type: string}
                            name: {type: string}
                      permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            action: {type: string, examples: ["admin::content.document.update"]}
                            subject: {type: string}
                            fields: {type: [array, "null"], items: {type: string}}
                            conditions: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/users:
    get:
      tags: [Administradores]
      summary: Lista administradores (busca, filtros, ordenação, paginação)
      description: "Permissão: `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Busca em nome, sobrenome, e-mail e CPF (a partir de 3 dígitos, com ou sem pontuação)"}
        - {name: roleId, in: query, schema: {type: string}, description: Filtra por role (UUID)}
        - {name: status, in: query, schema: {type: string}, description: "active, awaiting (já acessou, mas sem nenhuma role: aguardando liberação), inactive, pending (ainda sem primeiro acesso) ou blocked"}
        - {name: sort, in: query, schema: {type: string}, description: "Campo:direção. Campos: firstName, lastName, email, createdAt. Ex.: email:asc"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}, description: "Padrão 25, máximo 100"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Administradores]
      summary: Pré-cadastra um administrador pelo CPF
      description: |
        Cria o administrador (ativo, com as roles) antes do primeiro acesso; nome e e-mail vêm do MT Login quando
        a pessoa entrar. O status fica `pending` até lá. Só um Super Admin concede a role Super Admin.
        Exige a permissão `admin::settings.users.create`.
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, roleIds]
              properties:
                cpf: {type: string, description: "Com ou sem pontuação; validado", examples: ["529.982.247-25"]}
                roleIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
                departmentId: {type: string, format: uuid}
      responses:
        "201": {description: Administrador criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {description: "CPF já cadastrado (`cpf_taken`)", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/users/batch-delete:
    post:
      tags: [Administradores]
      summary: Exclui administradores em lote (tudo ou nada, até 100)
      description: "Permissão: `admin::settings.users.delete`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}:
    get:
      tags: [Administradores]
      summary: Detalha um administrador
      description: "Permissão: `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Administradores]
      summary: Edita dados do administrador (departamento)
      description: "Nome, CPF e e-mail vêm do MT Login e não são editáveis. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                departmentId: {type: [string, "null"], format: uuid}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Administradores]
      summary: Exclui um administrador
      description: "Não exclui a si mesmo nem o último Super Admin ativo (409). Permissão: `admin::settings.users.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/activate:
    post:
      tags: [Administradores]
      summary: Ativa o administrador
      description: "403 `target_more_privileged` se o administrador tem permissões que o ator não possui. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/deactivate:
    post:
      tags: [Administradores]
      summary: Desativa o administrador
      description: "O acesso é cortado na próxima requisição. 409 `cannot_modify_self` ou `last_super_admin`; 403 `target_more_privileged`. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/block:
    post:
      tags: [Administradores]
      summary: Bloqueia o administrador
      description: "Bloqueado, perde o acesso na próxima requisição (`account_disabled`) mas mantém as roles. 409 `cannot_modify_self` ou `last_super_admin`; 403 `target_more_privileged`. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/unblock:
    post:
      tags: [Administradores]
      summary: Desbloqueia o administrador
      description: "403 `target_more_privileged` se o administrador tem permissões que o ator não possui. Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/permissions:
    get:
      tags: [Administradores]
      summary: Permissões efetivas do administrador
      description: "As mesmas que ele recebe em `/api/admin/auth/me`, unidas entre todas as roles: `{isSuperAdmin, permissions[{action, subject, fields, conditions}]}`. Permissão: `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/roles:
    put:
      tags: [Administradores]
      summary: Substitui o conjunto de roles do administrador
      description: |
        Libera o acesso de quem aguarda liberação (`awaiting`) e edita as roles de uma vez. Só Super Admin concede ou retira a
        role Super Admin (403); o último Super Admin ativo não a perde (409). Quem não é Super Admin só atribui roles cujas
        permissões possui (403 `privilege_escalation`), não altera a própria conta (409 `cannot_modify_self`) nem a de quem tem
        mais poder (403 `target_more_privileged`). Permissão: `admin::settings.users.update`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Administradores]
      summary: Atribui roles ao administrador
      description: "Só Super Admin concede a role Super Admin (403). Quem não é Super Admin só atribui roles cujas permissões possui (403 `privilege_escalation`). Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/roles/{roleId}:
    delete:
      tags: [Administradores]
      summary: Remove uma role do administrador
      description: "O administrador precisa manter ao menos uma role; o último Super Admin ativo não perde a role (409). Permissão: `admin::settings.users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/roles:
    get:
      tags: [Roles de administrador]
      summary: Lista roles com a contagem de administradores
      description: "Permissão: `admin::settings.roles.read` ou `admin::settings.users.read` (alimenta o seletor de roles dos administradores). As permissões de cada role só vêm no detalhe, que exige `roles.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Roles de administrador]
      summary: Cria uma role
      description: "Permissão: `admin::settings.roles.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/roles/{id}:
    get:
      tags: [Roles de administrador]
      summary: Detalha a role com permissões e contagem de administradores
      description: "Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Roles de administrador]
      summary: Edita nome e descrição
      description: "Permissão: `admin::settings.roles.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Roles de administrador]
      summary: Exclui a role
      description: "409 super_admin_immutable ou role_in_use (com details.userCount). Permissão: `admin::settings.roles.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/roles/{id}/permissions:
    put:
      tags: [Roles de administrador]
      summary: Substitui, em transação, todas as permissões da role
      description: "Valida ações, campos e condições contra os registros. Super Admin é imutável (409). Quem não é Super Admin só concede ou amplia permissões que possui (403 `privilege_escalation`, com `details.permissions`) e não altera uma role que possui (409 `cannot_modify_own_role`). Invalida o cache de permissões. Permissão: `admin::settings.roles.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action: {type: string, examples: ["admin::content.document.update"]}
                      subject: {type: string, description: Padrão = recurso da ação}
                      fields: {type: [array, "null"], items: {type: string}, description: "null = todos os campos; [] = nenhum"}
                      conditions: {type: array, items: {type: string}, description: Combinadas com OR}
                      properties: {type: object}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/roles/{id}/duplicate:
    post:
      tags: [Roles de administrador]
      summary: Duplica a role (nome com sufixo, descrição e permissões)
      description: "Quem não é Super Admin só duplica roles cujas permissões possui (403 `privilege_escalation`). Permissão: `admin::settings.roles.create`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/catalog/actions:
    get:
      tags: [Catálogo]
      summary: Ações registradas, agrupadas por categoria
      description: "Base da tela de permissões. Cada ação informa suporte a campos, condições e locales, e os campos configuráveis (availableFields). Permissão: `admin::settings.roles.read`, `admin::settings.api-tokens.read` ou `admin::plugin.enduser-roles.read` (alimentam os seletores de ações de tokens e de roles de usuário final)."
      security: [{adminBearer: []}]
      parameters:
        - {name: domain, in: query, schema: {type: string, enum: [admin, api]}, description: "Padrão admin"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/catalog/conditions:
    get:
      tags: [Catálogo]
      summary: Condições disponíveis
      description: "Permissão: `admin::settings.roles.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/departments:
    get:
      tags: [Departamentos]
      summary: Lista departamentos com a contagem de administradores e documentos
      description: "Permissão: `admin::settings.departments.read` ou `admin::settings.users.read` (alimenta o seletor de departamento dos administradores). Resposta: `[{id, name, userCount, documentCount}]`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Departamentos]
      summary: Cria um departamento
      description: "Nome único (409 `department_name_taken`). Permissão: `admin::settings.departments.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "201": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/departments/{id}:
    get:
      tags: [Departamentos]
      summary: Detalha um departamento
      description: "Permissão: `admin::settings.departments.read` ou `admin::settings.users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Departamentos]
      summary: Renomeia um departamento
      description: "Permissão: `admin::settings.departments.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Departamentos]
      summary: Exclui um departamento
      description: "Recusado com 409 `department_in_use` (`details.userCount`, `details.documentCount`) se houver administradores ou documentos vinculados. Permissão: `admin::settings.departments.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/audit-logs:
    get:
      tags: [Auditoria]
      summary: Lista registros de auditoria (filtros por ator, ação, entidade e período)
      description: "Alterações trazem payload.before e payload.after. `actorName` é o nome atual do administrador (nulo para outros atores ou administrador excluído). Permissão: `admin::settings.audit-logs.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: actorType, in: query, schema: {type: string}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: entity, in: query, schema: {type: string}}
        - {name: entityId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string}, description: RFC 3339}
        - {name: to, in: query, schema: {type: string}, description: RFC 3339}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/auth/local/register:
    post:
      tags: [Usuários finais - autenticação]
      summary: Cadastro público
      description: "Respeita as configurações: cadastro habilitado (403 registration_disabled), uma conta por e-mail (409 already_taken) e confirmação obrigatória. Campos extras só são aceitos se constarem em registerAllowedFields (ficam em profile); outros geram 422."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 50, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "201": {description: Criado. Com confirmação de e-mail obrigatória não há tokens}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/local:
    post:
      tags: [Usuários finais - autenticação]
      summary: Login por e-mail ou nome de usuário
      description: "Erro genérico invalid_credentials. Só com a senha correta informa 403 account_blocked ou email_not_confirmed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: {type: string}
                password: {type: string}
      responses:
        "200": {description: Usuário e tokens}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/refresh:
    post:
      tags: [Usuários finais - autenticação]
      summary: Troca o refresh token (rotação com detecção de reuso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        "200": {description: Novo par de tokens}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/logout:
    post:
      tags: [Usuários finais - autenticação]
      summary: Encerra a sessão atual
      security: [{apiBearer: []}]
      responses:
        "204": {description: Sessão encerrada}
        "401": {$ref: "#/components/responses/Error"}
  /api/auth/email-confirmation:
    get:
      tags: [Usuários finais - autenticação]
      summary: Confirma o e-mail
      parameters:
        - {name: confirmation, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Confirmado}
        "302": {description: Redireciona para a URL configurada}
        "400": {$ref: "#/components/responses/Error"}
  /api/auth/send-email-confirmation:
    post:
      tags: [Usuários finais - autenticação]
      summary: Reenvia a confirmação de e-mail (sempre 204)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "204": {description: Aceito}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/forgot-password:
    post:
      tags: [Usuários finais - autenticação]
      summary: Solicita a redefinição de senha (sempre 204)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "204": {description: Aceito}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/auth/reset-password:
    post:
      tags: [Usuários finais - autenticação]
      summary: Redefine a senha com o token (uso único) e revoga as sessões
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string}
      responses:
        "204": {description: Senha redefinida}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/auth/change-password:
    post:
      tags: [Usuários finais - autenticação]
      summary: Troca a senha (exige a atual) e revoga as outras sessões
      security: [{apiBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string}
                newPassword: {type: string}
      responses:
        "204": {description: Senha alterada}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/users/me:
    get:
      tags: [Usuários finais - autenticação]
      summary: Usuário autenticado
      security: [{apiBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
  /api/admin/end-user-roles:
    get:
      tags: [Roles de usuário final]
      summary: Lista roles com a contagem de usuários
      description: "Permissão: `admin::plugin.enduser-roles.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Roles de usuário final]
      summary: Cria uma role customizada
      description: "Permissão: `admin::plugin.enduser-roles.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                permissions: {type: array, items: {type: string, examples: ["api::document.find"]}, description: Ações do domínio api}
      responses:
        "201": {description: Criada}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/end-user-roles/{id}:
    get:
      tags: [Roles de usuário final]
      summary: Detalha a role; cada permissão traz método e rota vinculada
      description: "Permissão: `admin::plugin.enduser-roles.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Roles de usuário final]
      summary: Edita a role; se permissions vier, substitui as permissões
      description: "Permissão: `admin::plugin.enduser-roles.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                permissions: {type: array, items: {type: string}, description: Opcional - ausente não altera}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Roles de usuário final]
      summary: Exclui a role; os usuários vinculados passam para a Public (mesma transação)
      description: "Permissão: `admin::plugin.enduser-roles.delete`. Public, Authenticated e a role padrão não podem ser excluídas (409 role_protected / role_is_default)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Excluída}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/end-users:
    get:
      tags: [Usuários finais - administração]
      summary: Lista usuários finais
      description: "Permissão: `admin::plugin.enduser-users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: roleId, in: query, schema: {type: string}}
        - {name: confirmed, in: query, schema: {type: boolean}}
        - {name: blocked, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {type: string}, description: "username, email ou createdAt (ex.: username:desc)"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Usuários finais - administração]
      summary: Cria um usuário final
      description: "Permissão: `admin::plugin.enduser-users.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                password: {type: string}
                roleId: {type: string, format: uuid, description: Padrão = role padrão das configurações}
                confirmed: {type: boolean}
                blocked: {type: boolean}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/end-users/{id}:
    get:
      tags: [Usuários finais - administração]
      summary: Detalha o usuário
      description: "Permissão: `admin::plugin.enduser-users.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Usuários finais - administração]
      summary: Edita usuário e e-mail; password opcional redefine a senha e revoga as sessões
      description: "Permissão: `admin::plugin.enduser-users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Usuários finais - administração]
      summary: Exclui o usuário
      description: "Permissão: `admin::plugin.enduser-users.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Excluído}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/end-users/{id}/block:
    post:
      tags: [Usuários finais - administração]
      summary: Bloqueia o usuário e revoga as sessões
      description: "Permissão: `admin::plugin.enduser-users.update`. Efeito imediato sobre access e refresh tokens."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/end-users/{id}/unblock:
    post:
      tags: [Usuários finais - administração]
      summary: Desbloqueia o usuário
      description: "Permissão: `admin::plugin.enduser-users.update`. "
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/end-users/{id}/confirm:
    post:
      tags: [Usuários finais - administração]
      summary: Marca o e-mail como confirmado
      description: "Permissão: `admin::plugin.enduser-users.update`. "
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/end-users/{id}/role:
    put:
      tags: [Usuários finais - administração]
      summary: Altera a role (um usuário tem uma única role)
      description: "Permissão: `admin::plugin.enduser-users.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: {type: string, format: uuid}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/end-user-settings:
    get:
      tags: [Configurações de usuários finais]
      summary: Lê as configurações avançadas
      description: "Permissão: `admin::plugin.enduser-settings.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [Configurações de usuários finais]
      summary: Substitui as configurações avançadas
      description: "Permissão: `admin::plugin.enduser-settings.update`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultRoleId]
              properties:
                defaultRoleId: {type: string, format: uuid}
                oneAccountPerEmail: {type: boolean}
                registrationEnabled: {type: boolean}
                emailConfirmationRequired: {type: boolean}
                resetPasswordUrl: {type: string}
                emailConfirmationRedirectUrl: {type: string}
                registerAllowedFields: {type: array, items: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/email-templates:
    get:
      tags: [Templates de e-mail]
      summary: Lista os templates
      description: "Permissão: `admin::settings.email-templates.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/email-templates/{key}:
    get:
      tags: [Templates de e-mail]
      summary: Lê um template (email-confirmation ou reset-password)
      description: "Permissão: `admin::settings.email-templates.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, enum: [email-confirmation, reset-password]}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Templates de e-mail]
      summary: Edita um template
      description: "Permissão: `admin::settings.email-templates.update`. O template é validado (sintaxe e execução com dados de exemplo)."
      security: [{adminBearer: []}]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, enum: [email-confirmation, reset-password]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderEmail, subject, bodyHtml]
              properties:
                senderName: {type: string}
                senderEmail: {type: string, format: email}
                replyTo: {type: string}
                subject: {type: string}
                bodyHtml: {type: string, description: "html/template. Variáveis: {{.User.Username}}, {{.User.Email}}, {{.Token}}, {{.URL}}, {{.ServerURL}}"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/api-tokens:
    get:
      tags: [Tokens de API]
      summary: Lista tokens de API (sem os revogados)
      description: "Permissão: `admin::settings.api-tokens.read`. O valor do token nunca é listado."
      security: [{adminBearer: []}]
      parameters:
        - {name: includeRevoked, in: query, schema: {type: boolean}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [Tokens de API]
      summary: Cria um token de API
      description: "Permissão: `admin::settings.api-tokens.create`. O campo `token` (formato `gat_...`) aparece **somente nesta resposta**; no banco fica apenas o HMAC-SHA256 com `API_TOKEN_SALT`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, lifespan]
              properties:
                name: {type: string, description: Único entre os tokens não revogados}
                description: {type: string}
                type: {type: string, enum: [read-only, full-access, custom]}
                permissions: {type: array, items: {type: string, examples: ["api::document.find"]}, description: Obrigatório (e só aceito) no tipo custom}
                lifespan: {type: string, enum: [7d, 30d, 90d, unlimited]}
      responses:
        "201": {description: Criado (inclui token)}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/api-tokens/{id}:
    get:
      tags: [Tokens de API]
      summary: Detalha um token (inclui last_used_at e status)
      description: "Permissão: `admin::settings.api-tokens.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Tokens de API]
      summary: Edita nome, descrição, tipo e ações (vale na próxima requisição)
      description: "Permissão: `admin::settings.api-tokens.update`. Token revogado não pode ser editado (409 token_revoked)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: {type: string}
                description: {type: string}
                type: {type: string, enum: [read-only, full-access, custom]}
                permissions: {type: array, items: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Tokens de API]
      summary: Revoga o token (efeito imediato e definitivo)
      description: "Permissão: `admin::settings.api-tokens.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Revogado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/api-tokens/{id}/regenerate:
    post:
      tags: [Tokens de API]
      summary: Regenera o valor do token (o anterior deixa de valer na hora)
      description: "Permissão: `admin::settings.api-tokens.regenerate`. Reinicia a validade conforme a duração original. O novo `token` aparece somente nesta resposta."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK (inclui token)}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents:
    get:
      tags: [Documentos - administração]
      summary: Lista documentos (permissão de registros e de campos aplicadas)
      description: "Permissão: `admin::content.document.read`. O filtro de condições restringe os registros (inclusive na contagem); cada registro sai apenas com os campos liberados para ele, mais os campos de sistema."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Busca em título e conteúdo}
        - {name: status, in: query, schema: {type: string, enum: [rascunho, publicado]}}
        - {name: department_id, in: query, schema: {type: string, format: uuid}}
        - {name: sort, in: query, schema: {type: string}, description: "titulo, status, created_at, updated_at ou published_at (ex.: titulo:asc)"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}, description: "Padrão 25, máximo 100"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Documentos - administração]
      summary: Cria um documento (sempre como rascunho)
      description: "Permissão: `admin::content.document.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Só os campos que a permissão libera (campos recusados geram 422 com a lista). Campos de sistema nunca são graváveis."
              properties:
                titulo: {type: string, maxLength: 200}
                conteudo: {type: string}
                status: {type: string, enum: [rascunho, publicado], description: "Somente em PUT. Mudar o status exige também a ação publish."}
                observacao_interna: {type: string}
                department_id: {type: [string, "null"], format: uuid, description: "Padrão na criação: departamento do administrador"}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}:
    get:
      tags: [Documentos - administração]
      summary: Detalha um documento
      description: "Permissão: `admin::content.document.read` (403 se o registro não passar nas condições)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Documentos - administração]
      summary: Atualiza campos do documento
      description: "Permissão: `admin::content.document.update`. 403 se o registro não passar nas condições; 422 com a lista de campos não permitidos. Mudar `status` exige também `admin::content.document.publish` (403 com details.action)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Só os campos que a permissão libera (campos recusados geram 422 com a lista). Campos de sistema nunca são graváveis."
              properties:
                titulo: {type: string, maxLength: 200}
                conteudo: {type: string}
                status: {type: string, enum: [rascunho, publicado], description: "Somente em PUT. Mudar o status exige também a ação publish."}
                observacao_interna: {type: string}
                department_id: {type: [string, "null"], format: uuid, description: "Padrão na criação: departamento do administrador"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Documentos - administração]
      summary: Exclui o documento
      description: "Permissão: `admin::content.document.delete` (403 se o registro não passar nas condições)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Excluído}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/publish:
    post:
      tags: [Documentos - administração]
      summary: Publica o documento
      description: "Permissão: `admin::content.document.publish`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/unpublish:
    post:
      tags: [Documentos - administração]
      summary: Despublica o documento (volta a rascunho)
      description: "Permissão: `admin::content.document.publish`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/files:
    get:
      tags: [Documentos - administração]
      summary: Lista os arquivos anexados ao documento (inclusive envios pendentes)
      description: "Permissão: `admin::content.document.file.read` (as condições valem sobre o documento; 403 se ele não passar)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      tags: [Documentos - administração]
      summary: Autoriza o envio de um arquivo (passo 1 de 2)
      description: "Permissão: `admin::content.document.file.upload`. Registra o arquivo como `pendente` e devolve `upload`: o navegador faz um POST multipart para `upload.url` com todos os `upload.fields` e, por último, o campo `file` com o conteúdo. O armazenamento recusa tipo ou tamanho diferentes dos declarados. Depois chame `/confirm`. Tipos: PDF e DOCX até 200 MB; PNG, JPEG e WebP até 25 MB. Máximo de 50 arquivos por documento."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename: {type: string, maxLength: 255, description: "A extensão precisa corresponder ao tipo"}
                content_type: {type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/png, image/jpeg, image/webp]}
                size_bytes: {type: integer, minimum: 1}
      responses:
        "201": {description: "Criado: `{file, upload: {url, fields, expires_at}}`"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/files/{fileId}/confirm:
    post:
      tags: [Documentos - administração]
      summary: Confirma o envio do arquivo (passo 2 de 2)
      description: "Permissão: `admin::content.document.file.upload`. A API confere o objeto no armazenamento (existência, tipo, tamanho e assinatura do formato). Se não passar, o objeto e o registro são apagados (422). Repetir a chamada num arquivo já confirmado é seguro. 409 `file_not_uploaded` se o envio ainda não aconteceu."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/files/{fileId}/download:
    get:
      tags: [Documentos - administração]
      summary: Devolve uma URL temporária para baixar o arquivo
      description: "Permissão: `admin::content.document.file.read`. Resposta `{url, expires_at}`; a URL baixa como anexo e vale poucos minutos. Arquivos pendentes respondem 404."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/admin/content/documents/{id}/files/{fileId}:
    delete:
      tags: [Documentos - administração]
      summary: Exclui o arquivo (registro e objeto)
      description: "Permissão: `admin::content.document.file.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Excluído}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/documents:
    get:
      tags: [Documentos - API pública]
      summary: Lista documentos publicados
      description: "Ação `api::document.find` (liberada à role Public pelo seed). Nunca expõe `observacao_interna`, `status`, `department_id` nem campos de autoria."
      security: [{}, {apiBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Busca em título e conteúdo}
        - {name: sort, in: query, schema: {type: string}, description: "titulo, published_at ou created_at (padrão published_at:desc)"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}, description: "Padrão 25, máximo 100"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Documentos - API pública]
      summary: Cria um documento (rascunho do usuário autenticado)
      description: "Ação `api::document.create` (role Authenticated). Aceita apenas `titulo` e `conteudo`."
      security: [{apiBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: {type: string, maxLength: 200}
                conteudo: {type: string}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/documents/{id}:
    get:
      tags: [Documentos - API pública]
      summary: Detalha um documento publicado (rascunho responde 404)
      description: "Ação `api::document.findOne`."
      security: [{}, {apiBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Documentos - API pública]
      summary: Atualiza o próprio documento
      description: "Ação `api::document.update` + policy `is-owner` (403 com details.policy; rascunho alheio responde 404)."
      security: [{apiBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: {type: string, maxLength: 200}
                conteudo: {type: string}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Documentos - API pública]
      summary: Exclui o próprio documento
      description: "Ação `api::document.delete` + policy `is-owner`."
      security: [{apiBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Excluído}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/documents/{id}/files:
    get:
      tags: [Documentos - API pública]
      summary: Lista os arquivos de um documento publicado
      description: "Ação `api::document.file.find`. Só arquivos confirmados; documento em rascunho responde 404."
      security: [{}, {apiBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/documents/{id}/files/{fileId}/download:
    get:
      tags: [Documentos - API pública]
      summary: Devolve uma URL temporária para baixar o arquivo de um documento publicado
      description: "Ação `api::document.file.download`. Resposta `{url, expires_at}`."
      security: [{}, {apiBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    apiBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT com audience `api` (usuário final) ou token de API (prefixo `gat_`, ver Tokens de API). Sem o cabeçalho a requisição é anônima (role Public).
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do MT Login (Keycloak/OIDC), assinado com RS256 e emitido para o client desta aplicação. O frontend conduz o login (Authorization Code + PKCE); a API só valida o token.
  responses:
    Error:
      description: Erro padronizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message]
          properties:
            status:
              type: integer
            code:
              type: string
              examples: [forbidden]
            message:
              type: string
            details:
              type: object
