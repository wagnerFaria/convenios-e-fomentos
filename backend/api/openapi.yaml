  /api/admin/content/documents:
    get:
      tags: [Documentos - administração]
      summary: Lista documentos (permissão de registros e de campos aplicadas)
      description: "Permissão: `admin::content.document.read`. O filtro de condições restringe os registros (inclusive na contagem); cada registro sai apenas com os campos liberados para ele, mais os campos de sistema."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Busca em título e conteúdo}
        - {name: status, in: query, schema: {type: string, enum: [rascunho, publicado]}}
        - {name: department_id, in: query, schema: {type: string, format: uuid}}
        - {name: sort, in: query, schema: {type: string}, description: "titulo, status, created_at, updated_at ou published_at (ex.: titulo:asc)"}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}, description: "Padrão 25, máximo 100"}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Documentos - administração]
      summary: Cria um documento (sempre como rascunho)
