        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    apiBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT com audience `api` (usuário final) ou token de API (prefixo `gat_`, ver Tokens de API). Sem o cabeçalho a requisição é anônima (role Public).
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do MT Login (Keycloak/OIDC), assinado com RS256 e emitido para o client desta aplicação. O frontend conduz o login (Authorization Code + PKCE); a API só valida o token.
  responses:
    Error:
      description: Erro padronizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message]
          properties:
            status:
              type: integer
            code:
              type: string
              examples: [forbidden]
            message:
              type: string
            details:
              type: object
