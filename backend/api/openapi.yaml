  /api/admin/rule-parameters:
    get:
      tags: [Parâmetros de regras]
      summary: Lista as versões dos parâmetros das regras de negócio
      description: "Cada parâmetro tem versões com vigência (`validFrom`, `validTo` nulo = sem fim). `?key=` filtra por chave. Permissão: `admin::settings.rule-parameters.read` (concedida ao proponente). Resposta: `[{id, key, value, validFrom, validTo, note, createdAt, updatedAt}]`."
      security: [{adminBearer: []}]
      parameters:
        - {name: key, in: query, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Parâmetros de regras]
      summary: Cria uma versão de parâmetro
      description: "`key` precisa ser uma das chaves conhecidas (ver `/keys`) e `value` segue o formato dela (422 caso contrário). Duas versões da mesma chave não podem se sobrepor (409 `rule_parameter_overlap`) nem começar na mesma data (409 `rule_parameter_exists`). Para trocar um valor a partir de uma data, encerre a versão atual (`validTo`) e crie a nova. Permissão: `admin::settings.rule-parameters.create`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value, validFrom]
              properties:
                key: {type: string}
                value: {description: "JSON no formato da chave."}
                validFrom: {type: string, format: date}
                validTo: {type: [string, "null"], format: date}
                note: {type: string, maxLength: 500}
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/rule-parameters/keys:
    get:
      tags: [Parâmetros de regras]
      summary: Lista as chaves de parâmetro conhecidas
      description: "Resposta: `[{key, description, source}]`, onde `source` é a norma de origem. Permissão: `admin::settings.rule-parameters.read`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/rule-parameters/effective:
    get:
      tags: [Parâmetros de regras]
      summary: Valor vigente de cada parâmetro numa data
      description: "Sem `date`, usa hoje (fuso de Cuiabá). Chaves sem versão vigente na data não aparecem (por exemplo, a data-limite eleitoral fora do ano eleitoral). Permissão: `admin::settings.rule-parameters.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/rule-parameters/{id}:
    get:
      tags: [Parâmetros de regras]
      summary: Detalha uma versão de parâmetro
      description: "Permissão: `admin::settings.rule-parameters.read`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Parâmetros de regras]
      summary: Altera uma versão de parâmetro
      description: "Altera valor, vigência e nota; a chave não muda (422). Mesmas validações e conflitos da criação. Permissão: `admin::settings.rule-parameters.update`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, validFrom]
              properties:
                key: {type: string, description: "Opcional; se informada, deve ser igual à atual."}
                value: {description: "JSON no formato da chave."}
                validFrom: {type: string, format: date}
                validTo: {type: [string, "null"], format: date}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Parâmetros de regras]
      summary: Exclui uma versão de parâmetro
      description: "Permissão: `admin::settings.rule-parameters.delete`."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/proponent-profile:
    get:
      tags: [Projetos]
      summary: Perfil do proponente autenticado
      description: "Dados de contato reaproveitados em cada projeto novo. `name` e `cpf` vêm do MT Login (somente leitura). Sem perfil salvo, devolve um vazio. `complete` indica celular, e-mail, município e cargo preenchidos. Permissão: `admin::proponent-profile.read`. Resposta: `{name, cpf, phones:[{number,type}], emails:[{address,primary}], uf, municipalityIbge, jobTitle, personal, complete}`."
      security: [{adminBearer: []}]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [Projetos]
      summary: Grava o perfil do proponente
      description: "Substitui os dados de contato. Telefones: DDD válido e número com 10 (fixo) ou 11 dígitos (celular, começando por 9); aceita pontuação e +55; no máximo 5, sem repetidos. E-mails: formato válido, minúsculas, no máximo 5, sem repetidos, um principal (o primeiro, se nenhum for marcado). O município precisa pertencer à UF. Perfis salvos não alteram projetos já criados (o projeto guarda uma cópia). Permissão: `admin::proponent-profile.update`."
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phones:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [number, type]
                    properties:
                      number: {type: string}
                      type: {type: string, enum: [mobile, landline]}
                emails:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [address]
                    properties:
                      address: {type: string}
                      primary: {type: boolean}
                uf: {type: string, minLength: 2, maxLength: 2}
                municipalityIbge: {type: string}
                jobTitle: {type: string, maxLength: 100}
                personal: {type: object, description: "Dados pessoais de quem assina as declarações (nacionalidade, maritalStatus single|married|stable_union|separated|divorced|widowed, zip, street, number, complement, district, uf, municipalityIbge). O CPF identifica a pessoa: não há RG. Cada projeto novo começa com eles."}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects:
    get:
      tags: [Projetos]
      summary: Lista projetos
      description: "Cada pessoa vê os projetos permitidos pela condição de sua permissão de leitura (o proponente, os que criou e os em que foi convidado por CPF). `q` busca em título, nome da instituição, número do SIGCon e CNPJ (com ou sem pontuação). Permissão: `admin::projects.read`. Resposta: `[{id, status, version, instrument, title, institutionName, institutionCnpj, sigconNumber, totalCents, code, submittedAt, stage, archiveReason, complementDueAt, isOwner, access (owner|edit|read; vazio para a equipe), createdAt, updatedAt}]`. A equipe recebe também `department {id, name}`, `framingStatus` (`pending`|`confirmed`) e `analyst {id, name}` (ausentes quando não se aplicam); o titular e os membros não. Filtros das filas da equipe: `stage`, `framing`, `department`, `analyst` (combinam-se com a permissão de leitura: o Revisor só enxerga o que é do departamento dele, mesmo sem filtro)."
      security: [{adminBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, archived]}}
        - {name: stage, in: query, schema: {type: string}, description: "Uma ou mais etapas separadas por vírgula: `awaiting_checklist`, `in_analysis`, `awaiting_proponent`, `awaiting_opinion`."}
        - {name: framing, in: query, schema: {type: string, enum: [pending, confirmed, none]}, description: "Situação do enquadramento. `none` = sem enquadramento em andamento."}
        - {name: department, in: query, schema: {type: string, format: uuid}, description: "Projetos cujo departamento atual é este."}
        - {name: analyst, in: query, schema: {type: string, format: uuid}, description: "Projetos cujo analista responsável é este."}
        - {name: sort, in: query, schema: {type: string, enum: [updated_at, created_at, title, institution_name]}, description: "Prefixo `-` para decrescente. Padrão: `-updated_at`."}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post:
      tags: [Projetos]
      summary: Cria um rascunho de projeto
      description: "Sem corpo. O rascunho nasce com o nome e o CPF do login e com os dados de contato do perfil do proponente (se houver). Permissão: `admin::projects.create`. Resposta: o projeto completo (ver `GET /admin/projects/{id}`)."
      security: [{adminBearer: []}]
      responses:
        "201": {description: Criado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}:
    get:
      tags: [Projetos]
      summary: Detalha um projeto
      description: |
        Permissão: `admin::projects.read`. Um projeto fora do alcance da permissão responde 404.
        Resposta: `{id, status, version, isOwner, access (owner|edit|read; vazio para a equipe), createdAt, updatedAt, proponent, institution, proposal, funding, documentOptions, documents {total, done, justified, missing, requiredTotal, requiredMissing}, code, stage, submittedAt, lateSubmission, complement, archive, originProjectId, originCode, issues}`. `code`, `stage` (`awaiting_checklist|in_analysis|awaiting_proponent`) e `submittedAt` só existem depois do envio; `complement` é o pedido de complementação aberto ou o mais recente `{number, status (open|answered|expired|cancelled), requestedAt, dueAt, overdue, message, items [{kind, target, label, note, answered}]}`; `archive` (`{at, reason (complement_deadline|withdrawn|denied|missing_documents|other), note}`) só existe em projeto arquivado. Projeto com o prazo de complementação vencido é arquivado na hora em que é aberto ou alterado (e pela rotina periódica).
        `version` deve ser enviada em toda gravação de seção (controle de edição simultânea).
        `issues` lista as pendências: `{section, field, code, severity (block|warn), message}`. O rascunho aceita dados incompletos;
        as pendências `block` são o que o envio (fase seguinte) vai exigir.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Projetos]
      summary: Exclui um rascunho
      description: "Só rascunhos (409 `project_not_editable` nos demais; projeto enviado se arquiva com `withdraw`). Os arquivos anexados são apagados do armazenamento. Permissão: `admin::projects.delete`, sujeita à condição da permissão (403 em projeto alheio)."
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Sem conteúdo}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/proponent:
    put:
      tags: [Projetos]
      summary: Grava a seção Proponente
      description: |
        Grava a seção inteira, com a `version` lida. Versão desatualizada: 409 `project_version_conflict` (`details.currentVersion`).
        `name` e `cpf` são de leitura e ignorados. Contato com as mesmas regras do perfil. Se `isLegalRepresentative` for `true`,
        os dados de outro representante são descartados; se `false`, `legalRepCpf` é validado quando informado.
        Permissão: `admin::projects.update` (403 em projeto alheio). Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                phones: {type: array, items: {type: object, properties: {number: {type: string}, type: {type: string, enum: [mobile, landline]}}}}
                emails: {type: array, items: {type: object, properties: {address: {type: string}, primary: {type: boolean}}}}
                uf: {type: string}
                municipalityIbge: {type: string}
                jobTitle: {type: string, maxLength: 100}
                isLegalRepresentative: {type: [boolean, "null"]}
                legalRepName: {type: string, maxLength: 150}
                legalRepCpf: {type: string}
                legalRepJobTitle: {type: string, maxLength: 100}
                personal: {type: object, description: "Dados pessoais do proponente (mesmo formato do perfil). Erros de validação: personal.<campo>."}
                legalRepPersonal: {type: object, description: "Dados pessoais do representante legal, quando é outra pessoa (mesmo formato); ignorados se isLegalRepresentative for true. Erros: legalRepPersonal.<campo>."}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/institution:
    put:
      tags: [Projetos]
      summary: Grava a seção Instituição
      description: |
        Grava a seção inteira, com a `version` lida (409 `project_version_conflict` se desatualizada).
        CNPJ validado (dígitos verificadores) e guardado só com dígitos. `entityTypeId` vem de `GET /admin/catalog/entity-types`:
        nos tipos comuns, `nature` e `nonProfit` são derivados do tipo; no tipo "Outro" (`entityTypeIsOther`), o proponente informa
        `entityTypeOther`, `nature` (`public|private`) e `nonProfit` (só privada). O Termo de Fomento (`instrument: fomento`) só é aceito
        para entidade privada sem fins lucrativos (422 em `instrument`); o Convênio vale para qualquer natureza.
        `habilitationStatus` (`full|partial`), `habilitationNumber` e `habilitationValidUntil` descrevem a Certidão de Habilitação do SIGCon.
        Permissão: `admin::projects.update`. Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                instrument: {type: string, enum: ["", convenio, fomento]}
                cnpj: {type: string}
                name: {type: string, maxLength: 200}
                entityTypeId: {type: string, format: uuid}
                entityTypeOther: {type: string, maxLength: 100}
                nature: {type: string, enum: ["", public, private]}
                nonProfit: {type: boolean}
                uf: {type: string}
                municipalityIbge: {type: string}
                zip: {type: string}
                street: {type: string, maxLength: 150}
                number: {type: string, maxLength: 20}
                complement: {type: string, maxLength: 100}
                district: {type: string, maxLength: 100}
                email: {type: string}
                phone: {type: string}
                habilitationStatus: {type: string, enum: ["", full, partial]}
                habilitationNumber: {type: string, maxLength: 50}
                habilitationValidUntil: {type: string, format: date}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/proposal:
    put:
      tags: [Projetos]
      summary: Grava a seção Proposta
      description: |
        Grava a seção inteira, com a `version` lida (409 `project_version_conflict` se desatualizada).
        `sigconNumber` no formato `NNNN/AAAA`; `sigconRegisteredOn` não pode ser futura; `endDate` não pode ser anterior a `startDate`.
        `municipalityCodes` é a lista de códigos IBGE dos municípios de execução (substitui a anterior; até 50; todos de MT, senão 422);
        na resposta vêm como `municipalities: [{ibgeCode, name, uf}]`. `objectNature`: `works|goods|services|event|other`.
        Um número do SIGCon igual ao de outro projeto gera aviso (`sigcon_duplicated`), não erro. Permissão: `admin::projects.update`.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                sigconNumber: {type: string, examples: ["3216/2026"]}
                sigconRegisteredOn: {type: string, format: date}
                title: {type: string, maxLength: 200}
                object: {type: string, maxLength: 5000}
                justification: {type: string, maxLength: 10000}
                startDate: {type: string, format: date}
                endDate: {type: string, format: date}
                objectNature: {type: string, enum: ["", works, goods, services, event, other]}
                hasArtisticHiring: {type: boolean}
                calamity: {type: boolean}
                executionPlaceDetail: {type: string, maxLength: 500}
                municipalityCodes: {type: array, maxItems: 50, items: {type: string}}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/funding:
    put:
      tags: [Projetos]
      summary: Grava a seção Recursos
      description: |
        Grava a seção inteira, com a `version` lida (409 `project_version_conflict` se desatualizada). Valores em **centavos**.
        `type`: `amendment` (emenda parlamentar), `own` (recurso próprio da SEDEC) ou `mixed` (os dois). `amendments` só existe em
        `amendment` e `mixed`; `ownAmountCents` não existe em `amendment`; sem `type` não há valores. Cada emenda traz
        `parliamentarianId` (do cadastro) ou, se o parlamentar não estiver nele, `parliamentarianName` por extenso; `number`, `year`
        (2000 a ano seguinte) e `amountCents`. `amendmentTotalCents` e `totalCents` (= próprio + emendas) são calculados pelo servidor
        e ignorados na entrada.
        Contrapartida: `counterpartKind` `financial|in_kind`; no Termo de Fomento só `in_kind` (422 em `financial`).
        `indirectCostsCents` só no Termo de Fomento (422 no Convênio); ao trocar o instrumento para Convênio o valor é zerado.
        Chamamento: `tenderStatus` `held|waived|unfeasible|not_applicable`; `tenderLegalBasis` (`art19_i..iv`, `art20_i`, `art20_ii`,
        `art20_singular` no Fomento; `conv14_i..iii` no Convênio) precisa combinar com a situação e o instrumento.
        Cachês (`artistFeesCents`, `regionalArtistFeesCents`, `governorWaiver`) só valem com contratação de artistas marcada na Proposta
        (422 senão); desmarcar na Proposta zera os valores. `priceOldestCollectedOn` é a data da referência de preço mais antiga.
        Os limites que dependem do valor total e das normas vigentes (custos indiretos, Lei 12.082/2023, chamamento exigido)
        não bloqueiam a gravação: aparecem em `issues` (`section: funding`). Permissão: `admin::projects.update`. Responde o projeto completo.
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                type: {type: string, enum: ["", amendment, own, mixed]}
                ownAmountCents: {type: integer, minimum: 0, maximum: 1000000000000}
                amendments:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      parliamentarianId: {type: string, format: uuid}
                      parliamentarianName: {type: string, maxLength: 120}
                      number: {type: string, maxLength: 30}
                      year: {type: integer}
                      amountCents: {type: integer, minimum: 0}
                counterpartKind: {type: string, enum: ["", financial, in_kind]}
                counterpartCents: {type: integer, minimum: 0}
                counterpartDescription: {type: string, maxLength: 1000}
                indirectCostsCents: {type: integer, minimum: 0}
                tenderStatus: {type: string, enum: ["", held, waived, unfeasible, not_applicable]}
                tenderNoticeNumber: {type: string, maxLength: 50}
                tenderApprovedOn: {type: string, format: date}
                tenderLegalBasis: {type: string}
                tenderJustification: {type: string, maxLength: 2000}
                artistFeesCents: {type: integer, minimum: 0}
                regionalArtistFeesCents: {type: integer, minimum: 0}
                governorWaiver: {type: boolean}
                priceOldestCollectedOn: {type: string, format: date}
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/admin/projects/{id}/document-options:
    put:
      tags: [Projetos]
      summary: Grava as situações que acrescentam documentos ao checklist
      description: "`exclusiveSupplier` (contratação por exclusividade), `publicSpaceUse` (atividade em espaço público; só no Termo de Fomento) e `reducedDeadline` (pedido de redução do prazo de tramitação). Exige a `version` lida (409 `project_version_conflict`). Permissão: `admin::projects.update`. Responde o projeto completo."
      security: [{adminBearer: []}]
